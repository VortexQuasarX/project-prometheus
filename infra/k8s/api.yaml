---
# Prometheus API — Deployment (production shape; image from ECR/registry)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-api
  labels: { app: prometheus-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: prometheus-api }
  template:
    metadata:
      labels: { app: prometheus-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: ghcr.io/vortexquasarx/prometheus-api:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: prometheus-config }
            - secretRef: { name: prometheus-secrets }
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-api
spec:
  selector: { app: prometheus-api }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: prometheus-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: prometheus-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
