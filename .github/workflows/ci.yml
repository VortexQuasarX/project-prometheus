name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install backend dependencies
        run: pip install -r app/requirements.txt
      - name: Ruff
        run: ruff check app tests scripts
      - name: Security scan (bandit)
        run: |
          pip install bandit
          bandit -r app -x app/tests -ll --skip B101
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt --ignore-vuln PYSECDATA-2023-0002 || true
      - name: Pytest
        run: python -m pytest tests/ -q
        env:
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: mock
          VECTOR_STORE_PROVIDER: local
          CACHE_PROVIDER: local
          ADMIN_API_KEY: test-admin-key

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Type-check
        working-directory: web
        run: npm run type-check
      - name: Build
        working-directory: web
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: prometheus-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          tags: prometheus-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
