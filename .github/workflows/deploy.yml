name: Deploy (manual, gated)

# MANUAL ONLY. Terraform plan runs on dispatch; apply requires BOTH the
# approve_apply input and the `production` environment (required reviewers
# when configured). AWS credentials come from GitHub secrets — never literals.

on:
  workflow_dispatch:
    inputs:
      enable_aws:
        description: "Enable AWS resources in the plan (default: safe dry plan)"
        type: boolean
        default: false
      approve_apply:
        description: "Set true to run terraform apply after plan (still gated by the environment)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Terraform fmt
        working-directory: infra
        run: terraform fmt -check -recursive
      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false
      - name: Terraform validate
        working-directory: infra
        run: terraform validate
      - name: Terraform plan
        working-directory: infra
        env:
          TF_IN_AUTOMATION: "1"
        run: terraform plan -input=false -out=tfplan -var "enable_aws=${{ inputs.enable_aws }}"
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 7

  apply:
    needs: plan
    if: inputs.approve_apply == true
    runs-on: ubuntu-latest
    environment: production # attach required reviewers for the human gate
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra
      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false
      - name: Terraform apply (reviewed plan)
        working-directory: infra
        env:
          TF_IN_AUTOMATION: "1"
        run: terraform apply -input=false tfplan
